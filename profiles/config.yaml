# Snakemake SLURM profile configuration
# Generic configuration - users should customize for their system
samples:
  - test





#parameter setting
runtime: 2880
slurm_account: "research-as-bt"
regular_memory: 3900
regular_partition: "compute"

high_memory: 16000
high_partition: "memory"


#each step parameter setting
fastp:
  threads: 8
  qualified_quality_phred: 20
  length_required: 20

bowtie2_build:
  threads: 2

bowtie2_removal:
  threads: 4

spades:
  threads: 16
  memory: 256
  k_values: "21,33,55,77,101,121"

seqkit:
  threads: 4
  min_length: 5000
  nr_width: 10

checkv:
  threads: 4

genomad:
  threads: 16

virsorter2:
  threads: 16
  min_length: 5000
  min_score: 0.5
  groups: "dsDNAphage,NCLDV,lavidaviridae"
  database: "/scratch/xunwang/freshwater_preservation/database/db"

deepvirfinder:
  threads: 12
  min_length: 3000
  dvf_path: "/scratch/xunwang/software/DeepVirFinder/dvf.py"
  dvf_models: "/scratch/xunwang/software/DeepVirFinder/models"

merge_filter:
  threads: 4
  vs2_min_score: 0.5
  vs2_allow_partial: false
  genomad_exclude_topology: "NONE"

cluster_index_build:
  threads: 4
  runtime: 1440
  mem_mb_per_cpu: 3900
  partition: "compute"

bowtie2_alignment:
  threads: 8
  runtime: 7200
  mem_mb_per_cpu: 2000
  partition: "compute"

coverm:
  threads: 4
  runtime: 1440
  mem_mb_per_cpu: 3900
  partition: "compute"

iphop:
  threads: 32
  runtime: 7200
  mem_mb_per_cpu: 3968
  partition: "compute"
  database: "database/iphop/iPHoP_db_Jun25_rw"





#database path
bowtie2_index: "database/T7_ref/GCF_000844825.1_ViralProj14460_genomic.fna"
checkv_db: "database/checkv-db-v1.5/"
genomad_db: "freshwater_preservation/database/genomad_db"

# Script paths
merge_script: "script/merge_viral_identification.py"
checkv_filter_script: "script/Second_filter.py"
checkv_scripts: "script/checkv"


executor: slurm
jobs: 50
use-conda: true
conda-prefix: conda_envs  # Will be created in working directory
rerun-incomplete: true
printshellcmds: true
keep-going: true

# Default resources for all jobs
# Users should modify slurm_account to match their SLURM account
default-resources:
  - slurm_account="research-as-bt"
  - slurm_partition="compute"
  - runtime=7200
  - mem_mb_per_cpu=3900
  - cpus_per_task=8

# Set threads for specific rules
